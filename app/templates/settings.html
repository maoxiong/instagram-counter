<style>
    /* Hidden hotspot at the top */
    #settingsHotspot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      z-index: 9998;
      /* Make it invisible but clickable */
      background: transparent;
      cursor: pointer;
    }

    #settingsModalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;         /* KEY FIX */
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #settingsModalOverlay.show {
      display: flex;
    }

    #settingsModal {
      background: #ffffff;
      padding: 20px 24px;
      border-radius: 8px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .settings-grid label {
      grid-column: 1 / span 1;
      align-self: center;
    }

    .settings-grid input[type="text"],
    .settings-grid input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 14px;
    }

    .settings-grid .full-width {
      grid-column: 1 / span 2;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .modal-footer a {
        font-size: 11px;
        text-decoration: none;
        color: #60809b;
    }

    .btn {
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      width: 75px;
    }

    .btn-primary {
      background: #22c55e;
      color: #ffffff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .color-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .color-inputs {
      display: flex;
      gap: 8px;
    }

    .color-text {
      width: 110px;
      padding: 4px;
    }

    .color-picker {
      width: 40px;
      height: 32px;
      padding: 0;
      border: none;
      background: none;
    }

    .loader {
        width: 12px;
        height: 12px;
        border: 2px solid #FFF;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }

    output {
        color: #60809b;
        font-weight: bold;
    }
</style>

<div id="settingsHotspot"></div>

<div id="settingsModalOverlay">
    <div id="settingsModal">
        <div class="settings-grid">
{% for setting in settings %}
    {% if setting.type == "text" %}
            <label for="{{ setting.name }}">{{ setting.label }}</label>
            <input id="{{ setting.name }}" name="{{ setting.name }}" type="text"
                   maxlength="{{ setting.maxlength }}"
                   placeholder="{{ setting.default }}" value="{{ setting.value }}"/>
    {% elif setting.type == "slider" %}
            <label for="{{ setting.name }}">{{ setting.label }} (<output id="{{ setting.name }}_OUTPUT">{{ setting.value }}</output>)</label>
            <input id="{{ setting.name }}" name="{{ setting.name }}" type="range" min="{{ setting.min }}"
                   max="{{ setting.max }}" step="{{ setting.step }}" value="{{ setting.value }}" oninput="{{ setting.name }}_OUTPUT.value = value"/>
    {% elif setting.type == "color" %}
            <div class="color-field">
                <label for="{{ setting.name }}">{{ setting.label }}</label>
                <div class="color-inputs">
                    <input
                            id="{{ setting.name }}"
                            type="text"
                            class="color-text"
                            placeholder="{{ setting.default }}"
                            maxlength="7"
                            value="{{ setting.value }}"
                    >
                    <input id="{{ setting.name }}_PICKER" type="color" class="color-picker" value="{{ setting.value }}">
                </div>
            </div>
    {% elif setting.type == "checkbox" %}
            <div class="full-width checkbox-row">
                <input id="{{ setting.name }}" name="{{ setting.name }}" type="checkbox" {{ "checked" if setting.value else "" }} />
                <label for="{{ setting.name }}">{{ setting.label }}</label>
            </div>
    {% endif %}
{% endfor %}
            <div class="full-width checkbox-row" style="margin-top: 20px; color: red; font-weight: bold;">
                <input id="LOCK_SETTINGS" name="LOCK_SETTINGS" type="checkbox"/>
                <label for="LOCK_SETTINGS">Lock settings</label>
            </div>
        </div>
        <div class="modal-footer">
            <div>
                <a href="https://github.com/maoxiong/instagram-counter" target="_blank">
                    Instagram Counter (v{{ version_code }})
                </a>
            </div>
            <div>
                <button type="button" class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="save(this)">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);

    // Username filter
    const username = $("INSTAGRAM_USERNAME");
    username.addEventListener("input", () => {
      // Remove invalid characters
      username.value = username.value
        .replace(/[^A-Za-z0-9._]/g, "")
        // Prevent multiple dots
        .replace(/\.{2,}/g, ".")
        // Prevent starting dot
        .replace(/^\./, "");
    });

    // Color field setup
    document.querySelectorAll(".color-field").forEach(field => {
        const text = field.querySelector(".color-text");
        const picker = field.querySelector(".color-picker");

        picker.addEventListener("input", () => {
          text.value = picker.value;
        });

        text.addEventListener("input", () => {
          const v = text.value.trim();
          if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
            picker.value = v;
          }
          if (v.length === 0) {
           picker.value = text.placeholder;
          }
        });
    });

    // Modal logic
    const hotspot = $("settingsHotspot");
    const modalOverlay = $("settingsModalOverlay");

    function openSettings() { modalOverlay.classList.add("show"); }
    function closeSettings() {
        // Reset back to current
{% for setting in settings %}
    {% if setting.type == "text" %}
        $("{{ setting.name }}").value = "{{ setting.value }}";
    {%elif setting.type == "slider" %}
        $("{{ setting.name }}").value = "{{ setting.value }}";
        $("{{ setting.name }}_OUTPUT").value = "{{ setting.value }}";
    {% elif setting.type == "color" %}
        $("{{ setting.name }}").value = "{{ setting.value }}";
        $("{{ setting.name }}_PICKER").value = "{{ setting.value }}";
    {% elif setting.type == "checkbox" %}
        $("{{ setting.name }}").checked = {{ "true" if setting.value else "false" }};
    {% endif %}
{% endfor %}

        // Hide modal
        modalOverlay.classList.remove("show");
    }

    hotspot.addEventListener("dblclick", openSettings);

    let lastTapTime = 0;
    hotspot.addEventListener("touchstart", e => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
        openSettings();
      }
      lastTapTime = now;
    });

    modalOverlay.addEventListener("click", e => {
      if (e.target === modalOverlay) closeSettings();
    });

    // Save logic
    function save(element) {
      element.innerHTML = '<span class="loader"></span>';

      const settings = {
{% for setting in settings %}
    {% if setting.name == "PAD_CHARACTER" %}
        PAD_CHARACTER: ($("PAD_CHARACTER").value === " " ? '" "' : $("PAD_CHARACTER").value),
    {% elif setting.type in ["text", "color"] %}
        {{ setting.name }}: $("{{ setting.name }}").value,
    {% elif setting.type == "slider" %}
        {{ setting.name }}: parseInt($("{{ setting.name }}").value, 10) || null,
    {% elif setting.type == "checkbox" %}
        {{ setting.name }}: $("{{ setting.name }}").checked,
    {% endif %}
{% endfor %}
        LOCK_SETTINGS: $("LOCK_SETTINGS").checked,
      };

      for (const [key, value] of Object.entries(settings)) {
          let v = value;

          if (typeof v === "boolean") v = v ? 1 : 0;

          if (v === "" || v === null || v === undefined) {
            document.cookie = `${key}=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT`;
            continue;
          }

          document.cookie = `${key}=${v}; path=/; expires=Fri, 31 Dec 9999 23:59:59 GMT`;
      }

      location.reload();
    }
</script>
