<!DOCTYPE html>
<html lang="en">
<head>
    <title>[{{ settings_by_name["INSTAGRAM_USERNAME"].value }}] {{ app_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="/static/manifest.json">

    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>
    <style>
        body {
           background-color: {{ settings_by_name["PAGE_BG"].value }} !important;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100dvh;
           margin: 0;
           overflow: hidden;
           font-family:arial,sans-serif;
        }

        main {
            display: flex;
            gap: {{ settings_by_name["FONT_SIZE"].value | int * 5 }}px;
        }

        .ig-logo svg {
            height: {{ settings_by_name["FONT_SIZE"].value }}rem;
            width: auto;
            display: block;
        }

        .tick {
          font-size:{{ settings_by_name["FONT_SIZE"].value }}rem; white-space:nowrap;
        }

        .tick-flip,.tick-text-inline {
          font-size:2.5em;
        }

        .tick-flip {
           font-family: {{ settings_by_name["FONT_FAMILY"].value | safe }} !important;
           border-radius:0.12em !important;
        }

        .tick-flip-panel {
           color: {{ settings_by_name["FLIP_FG"].value }} !important;
           background-color: {{ settings_by_name["FLIP_BG"].value }} !important;
        }

        .tick-flip-panel-text-wrapper {
           line-height: 1.45 !important;
        }

        .error {
            display: flex;
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 9999;
            padding: 10px;
            cursor: pointer;
            gap: 5px;
            align-items: center;
            font-size: 20px;
        }

        .error .message {
            color: {{ text_color }};
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<main>
    {% if settings_by_name["SHOW_IG_LOGO"].value %}
    <div class="ig-logo">
        {% include "icons/ig_logo.svg" %}
    </div>
    {% endif %}

    <div class="tick"
         data-value="{{ start_value }}"
         data-did-init="handleTickInit"
         data-transform="{{ transform | safe }}"
         data-credits="false"
    >
        <div data-repeat="true">
            <span data-view="flip"></span>
        </div>
    </div>
</main>

<div class="error hidden">
    ⚠️
    <span class="message hidden"></span>
</div>

<script>
    const VERSION_CODE = "{{ version_code }}";

    // Setup error message display
    const errorDiv = document.querySelector('.error');
    const errorMessageDiv = errorDiv.querySelector('.message');

    errorDiv.addEventListener('click', () => {
        errorMessageDiv.classList.toggle("hidden");
    });

    function handleTickInit(tick) {

        {% if settings_by_name["SHOW_IG_LOGO"].value %}
        const tickHeight = document.querySelector('.tick').offsetHeight;
        document.querySelector('.ig-logo svg').style.height = tickHeight + "px";
        {% endif %}

        Tick.data.poll(
            'api/followers',
            function(response) {
                const data = JSON.parse(response);

                // Update followed count
                if (data.followers !== undefined) {
                    tick.value = data.followers;
                }

                // Check for errors (such as username block or instagram ip block)
                if (data.error !== undefined) {
                    errorMessageDiv.textContent = data.error;
                    errorDiv.classList.remove("hidden");
                } else {
                    errorMessageDiv.classList.add("hidden");
                    errorDiv.classList.add("hidden");
                }

                // Check for updates
                if (data.version !== undefined && data.version !== VERSION_CODE) {
                    location.reload();
                }
            },
            {{ settings_by_name["REFRESH_INTERVAL"].value * 60000 }}
        );
    }
</script>

{% if settings_enabled %}
    {% include "settings.html" %}
{% endif %}

</body>
</html>
